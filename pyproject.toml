[project]
name = "mmm"
version = "0.4.0"
description = "Простая социальная сеть для общения молодежоактивных между собой."
dependencies = [
    "flask",
    "flask-sqlalchemy",
    "Flask-Migrate",
    "Flask-Mail",
    "itsdangerous"
]

[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]