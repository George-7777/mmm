{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}Регистрация{% endblock %}</h1>
{% endblock %}

{% block content %}
  <form method="post">
    <label for="username">Имя твое</label>
    <input name="username" id="username" required maxlength="20">
    <label for="password">Пароль твой</label>
    <input type="password" name="password" id="password" required>
    <label for="email">Почта твоя</label>
    <input type="email" name="email" id="email" required>
    <input type="submit" value="ВСТУПИ В КУЛЬТурное общество!">
  </form>
{% endblock %}
